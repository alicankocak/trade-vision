name: Trade Vision EKS Build And Deploy
run-name: Deployment triggered by @${{ github.actor }}

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: codebuild-trade-vision-runner-${{ github.run_id-github.run_attempt }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v2

      - name: Creating Environment Variables
        run: |
          echo "SERVICE_NAME=trade-vision-dev" >> $GITHUB_ENV
          echo "namespace=dcs-online-dev" >> $GITHUB_ENV
          echo "CLUSTER_NAME=atez-dev-cluster" >> $GITHUB_ENV
          echo "AWS_REGION=eu-central-1" >> $GITHUB_ENV
          echo "AWS_ECR=255114580789.dkr.ecr.eu-central-1.amazonaws.com" >> $GITHUB_ENV
          echo "DOCKER_IMAGE_REPO=255114580789.dkr.ecr.eu-central-1.amazonaws.com/trade-vision-dev" >> $GITHUB_ENV

      - name: AWS ECR login
        run: aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ECR }}

      - name: Docker Build, Tag and Push
        run: |
          docker build . -t ${{ env.SERVICE_NAME }}:${{ github.sha }} -f Dockerfile --network host --no-cache
          docker tag ${{ env.SERVICE_NAME }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_REPO }}:${{ github.sha }}
          # Buradaki parantez hatası (line 49) giderildi:
          docker tag ${{ env.SERVICE_NAME }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_REPO }}:latest
          docker push ${{ env.DOCKER_IMAGE_REPO }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE_REPO }}:latest

      - name: Checkout Helm Charts
        uses: actions/checkout@v2
        with:
          repository: 'atezsoftware/devops'
          token: ${{ secrets.DEVOPS_TOKEN }}
          path: 'devops'

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Deploy to Kubernetes
        id: helm_deploy
        run: |
          # 'args[2]' içindeki karakter hatasını (string vs map) ve Helm panik hatasını 
          # engellemek için tırnak yapısını ve komutu basitleştiriyoruz.
          helm upgrade --install ${{ env.SERVICE_NAME }} \
            -f ./devops/dev/trade-vision/trade-vision-values.yaml \
            --namespace ${{ env.namespace }} \
            --set image.tag=${{ github.sha }} \
            --set-string "args[2]=i=0; while [ \$i -lt 30 ]; do if [ -f /vault/secrets/config ]; then break; fi; echo Waiting...; sleep 2; i=\$((i+1)); done; . /vault/secrets/config && node server.js" \
            ./devops --wait --timeout 600s
        continue-on-error: true

      - name: Check Status on Failure
        if: steps.helm_deploy.outcome == 'failure'
        run: |
          echo "Deployment failed. Listing resources..."
          kubectl get deployments -n ${{ env.namespace }}
          kubectl get events -n ${{ env.namespace }} --sort-by='.metadata.creationTimestamp' | tail -n 15

      - name: Rollback on Failure
        if: steps.helm_deploy.outcome == 'failure'
        run: |
          helm rollback ${{ env.SERVICE_NAME }} 0 --namespace ${{ env.namespace }}
          exit 1